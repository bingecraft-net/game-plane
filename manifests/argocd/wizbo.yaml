# when pushed commits match repo targetRevision
# and pushed commits affect docker context or file
# then stream produces new build
#apiVersion: bingecraft.net/v0
#kind: BuildStream
#metadata:
#  name: wizbo
#  namespace: argocd
#spec:
#  source:
#    repoURL: https://github.com/bingecraft-net/game-plane/images/wizbo
#    targetRevision: HEAD
#    docker:
#      context: .
#      file: Containerfile
#      buildArgs:
#        - name: refspec
#          value: 99576749342afa1b498f8cbc97d1d17a119cad4e
#
#  imageTags:
#    - 'kubernetes.default.svc/wizbo:$git.commit.sha'
---
# https://argocd-image-updater.readthedocs.io/en/stable/
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: wizbo
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: wizbo
      images:
        - alias: wizbo
          imageName: wizbo
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wizbo
  # You'll usually want to add your resources to the argocd namespace.
  namespace: argocd
  # Add this finalizer ONLY if you want these to cascade delete.
  finalizers:
    # The default behaviour is foreground cascading deletion
    - resources-finalizer.argocd.argoproj.io
    # Alternatively, you can use background cascading deletion
    # - resources-finalizer.argocd.argoproj.io/background
  labels:
    name: wizbo
spec:
  project: default

  source:
    repoURL: https://github.com/bingecraft-net/game-plane.git
    targetRevision: HEAD
    path: manifests/wizbo

  # Destination cluster and namespace to deploy the application
  destination:
    # cluster API URL
    server: https://kubernetes.default.svc
    # or cluster name
    # name: my-game-cluster
    # The namespace will only be set for namespace-scoped resources that have not set a value for .metadata.namespace
    namespace: wizbo