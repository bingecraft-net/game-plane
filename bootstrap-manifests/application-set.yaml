apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: game-plane-apps
spec:
  generators:
    - git:
        repoURL: https://github.com/bingecraft-net/game-plane.git
        revision: HEAD
        directories:
          - path: manifests/*
  template:
    metadata:
      name: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/bingecraft-net/game-plane.git
        targetRevision: HEAD
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true