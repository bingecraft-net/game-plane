apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    name: bootstrap
spec:
  project: default
  sources:
    - repoURL: https://github.com/argoproj-labs/argocd-image-updater.git
      targetRevision: stable
      path: config
      directory:
        include: install.yaml
    - repoURL: https://github.com/bingecraft-net/game-plane.git
      targetRevision: HEAD
      path: manifests/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
